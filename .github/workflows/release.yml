name: Release

# Push a tag like v0.2.0 to build binaries for every platform, attach them to
# a GitHub release, and publish the server image to GHCR.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build
        # local-embed: built-in semantic search (off until MEMDUSA_EMBED_URL=local); ONNX Runtime is linked in statically
        run: cargo build --release --locked --target ${{ matrix.target }} -p memdusa --features local-embed
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="memdusa-${GITHUB_REF_NAME}-${TARGET}"
          mkdir "$name"
          cp README.md LICENSE NOTICE "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/${TARGET}/release/memdusa.exe" "$name/"
            7z a "$name.zip" "$name" >/dev/null
            archive="$name.zip"
          else
            cp "target/${TARGET}/release/memdusa" "$name/"
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          # sha256sum on Linux/Windows (Git Bash), shasum on macOS
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  release:
    name: publish release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  # Updates Formula/memdusa.rb in <owner>/homebrew-tap. Skipped for pre-releases (tags with a '-').
  homebrew:
    name: update homebrew tap
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Render formula
        run: packaging/homebrew/render-formula.sh "$GITHUB_REF_NAME" dist "$GITHUB_REPOSITORY" > memdusa.rb
      - name: Push to tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set, so the Homebrew tap was not updated. Create an SSH key pair, add the public key as a deploy key with write access to ${OWNER}/homebrew-tap, and store the private key as the repository secret HOMEBREW_TAP_DEPLOY_KEY."
            exit 0
          fi
          key="$RUNNER_TEMP/tap_deploy_key"
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" > "$key")
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 "git@github.com:${OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp memdusa.rb tap/Formula/memdusa.rb
          cd tap
          if [[ -z "$(git status --porcelain Formula/memdusa.rb)" ]]; then
            echo "Formula already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/memdusa.rb
          git commit -m "memdusa ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main

  image:
    name: build image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set image name and platform pair
        env:
          OWNER: ${{ github.repository_owner }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "IMAGE=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/memdusa" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-merge:
    name: publish image
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/memdusa" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create manifest list and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$TAGS"
          args=()
          for tag in "${tags[@]}"; do
            args+=(-t "$tag")
          done
          for digest in /tmp/digests/*; do
            args+=("${IMAGE}@sha256:${digest##*/}")
          done
          docker buildx imagetools create "${args[@]}"
          echo "FIRST_TAG=${tags[0]}" >> "$GITHUB_ENV"
      - name: Inspect manifest list
        run: docker buildx imagetools inspect "$FIRST_TAG"
