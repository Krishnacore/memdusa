name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

  # The store tests run against SQLite always; here also against real Postgres.
  test-postgres:
    name: test (postgres ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg: ["15", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: memdusa
          POSTGRES_PASSWORD: memdusa
          POSTGRES_DB: memdusa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memdusa" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      MEMDUSA_TEST_POSTGRES_URL: postgres://memdusa:memdusa@localhost:5432/memdusa_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

  homebrew:
    name: homebrew formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck packaging/homebrew/render-formula.sh
      - name: Render and check the formula
        run: |
          script="$PWD/packaging/homebrew/render-formula.sh"
          dir="$(mktemp -d)"
          targets="aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu"
          i=0
          for t in $targets; do
            i=$((i + 1))
            printf '%064x  memdusa-v1.2.3-%s.tar.gz\n' "$i" "$t" > "$dir/memdusa-v1.2.3-$t.tar.gz.sha256"
          done
          "$script" v1.2.3 "$dir" owner/repo > "$dir/memdusa.rb"
          ruby -c "$dir/memdusa.rb"
          i=0
          for t in $targets; do
            i=$((i + 1))
            grep -qF "https://github.com/owner/repo/releases/download/v1.2.3/memdusa-v1.2.3-$t.tar.gz\"" "$dir/memdusa.rb"
            grep -qF "$(printf '%064x' "$i")" "$dir/memdusa.rb"
          done
          # a missing checksum file must fail
          rm "$dir/memdusa-v1.2.3-x86_64-apple-darwin.tar.gz.sha256"
          if "$script" v1.2.3 "$dir" owner/repo > /dev/null; then echo "missing checksum was accepted"; exit 1; fi
          # so must a malformed one
          echo "nothex  file" > "$dir/memdusa-v1.2.3-x86_64-apple-darwin.tar.gz.sha256"
          if "$script" v1.2.3 "$dir" owner/repo > /dev/null; then echo "malformed checksum was accepted"; exit 1; fi

  docker:
    name: docker build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set platform pair
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
