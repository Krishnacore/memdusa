[package]
name = "memdusa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/memdusa-v{ version }-{ target }{ archive-suffix }"
bin-dir = "memdusa-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
# Built-in embeddings (ONNX Runtime + a small sentence-transformer). Off in default/release builds.
local-embed = ["dep:fastembed"]

[dependencies]
memdusa-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
clap.workspace = true
http = "1"
reqwest.workspace = true
thiserror.workspace = true
futures = "0.3"
sse-stream = "0.2"
sha2.workspace = true
jsonwebtoken.workspace = true
base64 = "0.22"
getrandom = "0.4"
serde_urlencoded = "0.7"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
gethostname = "1"
rmcp.workspace = true
sqlx.workspace = true
fastembed = { workspace = true, optional = true }

[dev-dependencies]
yaml-rust2 = "0.10"
