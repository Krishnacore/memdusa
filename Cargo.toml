[workspace]
resolver = "3"
members = ["crates/memdusa-core", "crates/memdusa"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
memdusa-core = { path = "crates/memdusa-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
uuid = { version = "1", features = ["v7"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3", features = ["server", "client", "macros", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
